site_name: Media Journal
site_description: Official documentation for Media Journal
site_author: Mihail Pop
site_url: https://mihail-pop.github.io/media-journal/ 
repo_name: media-journal
repo_url: https://github.com/mihail-pop/media-journal

theme:
  name: material
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.tabs
  palette:
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

    - scheme: default
      primary: white
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

nav:
  - Welcome: index.md
  - Setup:
    - Docker: setup/docker.md
    - Windows: setup/windows.md
    - Mac: setup/mac.md
    - Linux: setup/linux.md
  - Configuration:
    - Authentication: configuration/authentication.md
  - App Guide:
    - Home: app-guide/home.md
    - Lists: app-guide/lists.md
    - Details: app-guide/details.md
  - Developer Guide:
    - Architecture: developer/architecture.md
    - Database: developer/database.md

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight

copyright: "Copyright &copy; 2026 Media Journal"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mihail-pop/media-journal
      name: Media Journal on GitHub

extra_css:
  - stylesheets/custom.css
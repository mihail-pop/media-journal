{% load static %}
{# Twemoji graphics by Twitter, Inc. and other contributors, CC BY 4.0. Local attribution accompanies the SVGs. #}
<button id="review-snowfriend" class="review-corner-guest" type="button" title="Shake a little snow loose" aria-label="Shake the snowman for a snow shower" hidden>
  <span class="review-corner-art" data-review-guest="snowman">
    <img src="{% static 'core/img/year_review/snowman.svg' %}" alt="" draggable="false">
  </span>
  <span class="review-corner-art" data-review-guest="tree" hidden>
    <img src="{% static 'core/img/year_review/christmas-tree.svg' %}" alt="" draggable="false">
    <svg class="review-corner-lights" viewBox="0 0 36 36" aria-hidden="true" focusable="false"><circle cx="16.1" cy="11.6" r=".65"/><circle cx="19.6" cy="24.6" r=".75"/><circle cx="22" cy="15" r=".75"/><circle cx="9.6" cy="25.6" r=".65"/><circle cx="13.6" cy="18.6" r=".65"/><circle cx="25.6" cy="22.6" r=".65"/></svg>
  </span>
  <span class="review-corner-art" data-review-guest="party" hidden>
    <img src="{% static 'core/img/year_review/party-popper.svg' %}" alt="" draggable="false">
  </span>
  <img data-review-guest-gift src="{% static 'core/img/year_review/wrapped-gift.svg' %}" alt="" draggable="false" hidden>
  <span class="review-corner-bubble" aria-hidden="true">Snow much fun!</span>
</button>

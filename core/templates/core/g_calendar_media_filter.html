<div class="calendar-media-filter">
    <button type="button" class="calendar-media-toggle" aria-expanded="false" aria-label="Filter releases by media type">
        <span class="calendar-media-label">{{ calendar_filter_label|default:"All Media" }}</span>
        <svg class="calendar-media-arrow" viewBox="0 0 12 8" width="12" height="8" aria-hidden="true"><path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="calendar-media-options" role="group" aria-label="Media types" hidden>
        <div class="calendar-media-filter-actions">
            <button type="button" data-media-action="all">All</button>
            <button type="button" data-media-action="clear">Clear</button>
        </div>
        <div class="calendar-media-choices"></div>
    </div>
</div>

{% extends 'core/g_base.html' %}
{% load static %}

{% block head %}
{{ block.super }}
<title>Community - Media Journal</title>
<link rel="stylesheet" href="{% static 'core/css/p_community.css' %}">
<link rel="preconnect" href="{{ firebase_url }}" crossorigin>
{% endblock %}

{% block content %}
<script>document.body.dataset.theme = '{{ theme_mode }}';</script>
<div class="separator-bar"></div>
<div class="list-page-container">
  <section class="list-content">
    <div id="community-root" data-firebase-url="{{ firebase_url }}">
      <div class="community-header">
        <h2 class="section-title">Posts</h2>
        <div class="username-container" data-empty="{% if username %}false{% else %}true{% endif %}">
          <span class="username-sizing" aria-hidden="true">{{ username|default_if_none:'' }}</span>
          <input type="text" id="username-field" placeholder="Username (optional)" maxlength="50" aria-label="Username" value="{{ username|default_if_none:'' }}">
        </div>
      </div>
      <div class="community-composer new-post-box" id="post-composer">
        {% include 'core/g_community_composer.html' %}
      </div>
      <div id="posts-container"></div>
      <div id="community-feed-status" role="status" hidden></div>
      <div id="community-feed-sentinel" aria-hidden="true"></div>
    </div>
  </section>
</div>
<template id="community-composer-template">{% include 'core/g_community_composer.html' %}</template>
{{ items|json_script:"media-items-json" }}
<script src="{% static 'core/js/p_community_content.js' %}"></script>
<script src="{% static 'core/js/p_community.js' %}"></script>
{% endblock %}
